<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740">
  <defs>
    <pattern id="holes" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2.6" fill="#9ca3af"/>
    </pattern>
    <style>
      .title{font:700 28px sans-serif;fill:#172033}.label{font:700 17px sans-serif;fill:#172033}.small{font:14px sans-serif;fill:#29364d}.tiny{font:12px monospace;fill:#29364d}.module{stroke-width:3;rx:12}.header{fill:#fff;stroke:#34445e;stroke-width:2}.wire{fill:none;stroke-width:4}.dim{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1400" height="740" fill="#f4f1e8"/>
  <text x="60" y="45" class="title">BU-22 Brain - 24 x 56 stripboard placement (component side)</text>
  <text x="60" y="72" class="small">Long copper strips run left-right. USB connectors face the lower edge.</text>

  <g transform="translate(60 105)">
    <rect x="0" y="0" width="1120" height="480" rx="12" fill="#d9b071" stroke="#6b4f2c" stroke-width="4"/>
    <rect x="0" y="0" width="1120" height="480" rx="12" fill="url(#holes)" opacity="0.78"/>
    <text x="18" y="28" class="tiny">A</text><text x="18" y="468" class="tiny">X</text>
    <text x="5" y="505" class="tiny">1</text><text x="1090" y="505" class="tiny">56</text>

    <!-- Audio: deliberately placed at the less critical far-left position -->
    <rect class="module" x="75" y="40" width="180" height="380" fill="#3978a8" stroke="#172033"/>
    <text x="165" y="80" text-anchor="middle" class="label" fill="#fff">AUDIO FX</text>
    <text x="165" y="103" text-anchor="middle" class="small" fill="#fff">16 MB + 2x2 W</text>
    <rect x="115" y="395" width="100" height="38" rx="5" fill="#b8c2cc" stroke="#172033" stroke-width="2"/>
    <text x="165" y="457" text-anchor="middle" class="label">USB EDGE</text>
    <rect x="95" y="145" width="38" height="55" rx="4" fill="#232a35"/><rect x="197" y="145" width="38" height="55" rx="4" fill="#232a35"/>
    <text x="114" y="220" text-anchor="middle" class="tiny" fill="#fff">L</text><text x="216" y="220" text-anchor="middle" class="tiny" fill="#fff">R</text>

    <!-- Feather: central and adjacent to RTC/control I/O -->
    <rect class="module" x="330" y="40" width="180" height="380" fill="#2b4f78" stroke="#172033"/>
    <text x="420" y="82" text-anchor="middle" class="label" fill="#fff">FEATHER</text>
    <text x="420" y="105" text-anchor="middle" class="small" fill="#fff">RP2040 BRAIN</text>
    <rect x="380" y="395" width="80" height="38" rx="5" fill="#b8c2cc" stroke="#172033" stroke-width="2"/>
    <text x="420" y="457" text-anchor="middle" class="label">USB-C EDGE</text>
    <g fill="#f5d36a" stroke="#172033"><circle cx="345" cy="70" r="6"/><circle cx="345" cy="95" r="6"/><circle cx="345" cy="120" r="6"/><circle cx="495" cy="70" r="6"/><circle cx="495" cy="95" r="6"/><circle cx="495" cy="120" r="6"/></g>

    <!-- RTC -->
    <rect class="module" x="575" y="45" width="205" height="175" fill="#253746" stroke="#172033"/>
    <text x="677" y="82" text-anchor="middle" class="label" fill="#fff">DS3231 RTC</text>
    <circle cx="675" cy="145" r="43" fill="#c6cbd2" stroke="#172033" stroke-width="3"/>
    <text x="677" y="202" text-anchor="middle" class="tiny" fill="#fff">VIN GND SCL SDA SQW</text>

    <!-- Power -->
    <rect x="845" y="35" width="220" height="112" rx="10" fill="#ffe4dd" stroke="#b43c2f" stroke-width="3"/>
    <text x="955" y="66" text-anchor="middle" class="label">EXTERNAL 5 V</text>
    <rect x="870" y="82" width="72" height="42" class="header"/><text x="906" y="108" text-anchor="middle" class="small">+  -</text>
    <path d="M956 104 L1010 104" class="wire" stroke="#b43c2f"/><polygon points="1010,86 1040,104 1010,122" fill="#b43c2f"/><line x1="1044" y1="84" x2="1044" y2="124" stroke="#172033" stroke-width="5"/>
    <text x="1020" y="140" text-anchor="middle" class="tiny">D1 1N5817</text>

    <!-- IO headers -->
    <rect x="565" y="365" width="220" height="64" rx="8" fill="#eef3f7" stroke="#34445e" stroke-width="3"/>
    <text x="675" y="389" text-anchor="middle" class="label">BUTTONS</text><text x="675" y="414" text-anchor="middle" class="tiny">G B1 B2 B3 B4 B5 B6 B7</text>

    <rect x="815" y="185" width="120" height="64" rx="8" fill="#eef3f7" stroke="#34445e" stroke-width="3"/>
    <text x="875" y="210" text-anchor="middle" class="label">HEART</text><text x="875" y="234" text-anchor="middle" class="tiny">SQW G</text>
    <rect x="950" y="185" width="120" height="64" rx="8" fill="#eef3f7" stroke="#34445e" stroke-width="3"/>
    <text x="1010" y="210" text-anchor="middle" class="label">ANT</text><text x="1010" y="234" text-anchor="middle" class="tiny">R G B GND</text>

    <rect x="815" y="275" width="120" height="64" rx="8" fill="#eef3f7" stroke="#34445e" stroke-width="3"/>
    <text x="875" y="300" text-anchor="middle" class="label">SENSOR</text><text x="875" y="324" text-anchor="middle" class="tiny">3V G S X</text>
    <rect x="950" y="275" width="120" height="64" rx="8" fill="#eef3f7" stroke="#34445e" stroke-width="3"/>
    <text x="1010" y="300" text-anchor="middle" class="label">SPARE</text><text x="1010" y="324" text-anchor="middle" class="tiny">18 19 20 25 G</text>

    <rect x="575" y="270" width="210" height="66" rx="8" fill="#f7edcf" stroke="#8b6d24" stroke-width="3"/>
    <text x="680" y="297" text-anchor="middle" class="label">RTC SQW / HEARTBEAT</text><text x="680" y="321" text-anchor="middle" class="tiny">3V3 - 10k (optional) - HEART</text>

    <text x="850" y="400" class="small">Keep this lower-right zone open</text>
    <text x="850" y="423" class="small">for wiring, test points, and sensor changes.</text>
  </g>

  <g transform="translate(60 630)">
    <line x1="0" y1="0" x2="1120" y2="0" class="dim"/><text x="560" y="30" text-anchor="middle" class="small">Approx. 142.2 mm (56 holes at 2.54 mm pitch)</text>
    <rect x="1160" y="-44" width="175" height="78" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="1175" y="-18" class="small">Board: ~142 x 61 mm</text><text x="1175" y="6" class="small">Modules socketed</text><text x="1175" y="29" class="small">Component-side view</text>
  </g>
</svg>
